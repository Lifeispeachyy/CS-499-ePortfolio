<div class="card" style="width: 16rem;">
  <div class="card-header">{{ trip.name }}</div>
  <img src="assets/{{ trip.image }}" alt="trip thumbnail" class="card-img-top">
  <div class="card-body">
    <h6 class="card-subtitle mb-2 text-muted">
      {{ trip.resort }}
    </h6>
    <p class="card-subtitle mt-3 mb-3 text-muted">
      {{ trip.length }} only {{ trip.perPerson }} per person
    </p>
    <p class="card-text">
      {{ trip.description }}
    </p>
    <button class="btn btn-secondary mt-2" (click)="editTrip()" *ngIf="isLoggedIn()">Edit Trip</button> 
  </div>
</div>
